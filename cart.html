<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart | DigiCam Co.</title>

    <link rel="stylesheet" href="CSS/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>

  <body>
    <nav class="navbar">
      <h2 class="logo">DIGICAM <span>Co.</span></h2>

      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>

      <div class="nav-icons">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass" id="searchIcon"></i>
            <input type="text" placeholder="Search..." id="searchInput" />
          </div>
        
        <a href="cart.html" class="cart-link active">
          <i class="fa-solid fa-cart-shopping"></i>
          <span class="cart-count">0</span>
          </a>
        
        <button class="menu-toggle" >
          <i class="fa-solid fa-bars"></i>
        </button>
      </div>

      <div class="mobile-menu">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>

        <div class="mobile-search">
          <input type="text" placeholder="Search cameras" />
        </div>

        <a href="cart.html" class="mobile-cart active">
          <i class="fa-solid fa-cart-shopping"></i>
          <h3>Cart</h3>
          <span class="cart-count">0</span>
        </a>
      </div>
    </nav>

    <section class="cart-hero">
      <h1>Your Cart</h1>
      <p>Review your selected vintage cameras before checkout.</p>
    </section>

    <section class="cart-section reveal">
      <div class="cart-items" id="cartItems"></div>

      <div class="cart-summary">
        <h2>Order Summary</h2>

        <div class="summary-row">
          <span>Items</span>
          
          <span id="summaryItems">0</span>
        </div>
        <div class="summary-row">
          <span>Total</span>
          <span id="summaryTotal">$0</span>
        </div>
        <button id="checkoutBtn">Checkout</button>
        <button id="clearCartBtn" class="clear-cart-btn">Clear Cart</button>
      </div>
    </section>

    <footer>
      <p>© 2026 DigiCam Co. All rights reserved.</p>
    </footer>

    <script src="JavaScript/script.js"></script>
  </body>
</html>
